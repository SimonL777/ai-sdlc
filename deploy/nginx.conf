server {
 listen 8080; root /usr/share/nginx/html; client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = /config.js { add_header Cache-Control "no-store"; }
 location /api/automation/ { proxy_pass http://automation-platform:8083/api/; proxy_read_timeout 90s; }
 location /api/sandbox/ { proxy_pass http://sandbox-gateway:8081/api/; proxy_read_timeout 90s; }
 location /api/model-console/ { proxy_pass http://model-gateway:8082/api/; proxy_read_timeout 90s; }
 location /api/model/ { proxy_pass http://model-gateway:8082/v1/; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 90s; }
 location = /automation { return 301 /automation/; }
 location = /models { return 301 /models/; }
 location = /sandbox { return 301 /sandbox/; }
 location /automation/ { proxy_pass http://automation-console:8080/; }
 location /models/ { proxy_pass http://model-console:8080/; }
 location /sandbox/ { proxy_pass http://sandbox-console:8080/; }
 location = /health/automation { proxy_pass http://automation-platform:8083/actuator/health; }
 location = /health/model { proxy_pass http://model-gateway:8082/actuator/health; }
 location = /health/sandbox { proxy_pass http://sandbox-gateway:8081/actuator/health; }
 location / { try_files $uri $uri/ /index.html; }
}
