server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 128k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = /config.js { add_header Cache-Control "no-store"; }
 location /api/automation/ { proxy_pass http://automation-platform:8083/api/; proxy_http_version 1.1; proxy_read_timeout 70s; proxy_set_header Authorization $http_authorization; proxy_set_header Idempotency-Key $http_idempotency_key; }
 location /api/sandbox/ { proxy_pass http://sandbox-gateway:8081/api/; proxy_http_version 1.1; proxy_read_timeout 70s; proxy_set_header Authorization $http_authorization; proxy_set_header Idempotency-Key $http_idempotency_key; }
 location /api/model/ { proxy_pass http://model-gateway:8082/v1/; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 70s; proxy_set_header Authorization $http_authorization; }
 location = /health/automation { proxy_pass http://automation-platform:8083/actuator/health; }
 location = /health/sandbox { proxy_pass http://sandbox-gateway:8081/actuator/health; }
 location = /health/model { proxy_pass http://model-gateway:8082/actuator/health; }
 location / { try_files $uri $uri/ /index.html; }
}
