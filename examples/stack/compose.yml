name: ai-sdlc
x-java-environment: &java-env
  API_TOKEN: ${API_TOKEN:?Run setup_env.py first}
  SUPABASE_JWT_ISSUER: ${AI_SDLC_JWT_ISSUER:-}
  SUPABASE_JWKS_URL: ${AI_SDLC_JWKS_URL:-}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
services:
  sandbox-gateway:
    build: ../../../sandbox-gateway
    image: ai-sdlc/sandbox-gateway:0.2.0
    restart: unless-stopped
    environment:
      <<: *java-env
      PORT: 8081
      DATABASE_URL: ${SANDBOX_DATABASE_URL:-}
      DATABASE_USER: ${SANDBOX_DATABASE_USER:-}
      DATABASE_PASSWORD: ${SANDBOX_DATABASE_PASSWORD:-}
      SUPABASE_URL: ${SANDBOX_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SANDBOX_SUPABASE_SERVICE_ROLE_KEY:-}
      ARTIFACT_MODE: ${ARTIFACT_MODE:-supabase}
      ARTIFACT_DIR: /app/data/artifacts
      DB_SCHEMA: sandbox_gateway
      SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?Run setup_env.py first}
      STORAGE_BUCKET: sandbox-gateway-artifacts
      SANDBOX_IMAGE: ai-sdlc-runner:0.2.0
    group_add: ["${DOCKER_GID:?Set Docker socket group ID}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-data:/app/data
    mem_limit: 640m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
  model-gateway:
    build: ../../../model-gateway
    image: ai-sdlc/model-gateway:0.2.0
    restart: unless-stopped
    environment:
      <<: *java-env
      PORT: 8082
      DATABASE_URL: ${MODEL_DATABASE_URL:-}
      DATABASE_USER: ${MODEL_DATABASE_USER:-}
      DATABASE_PASSWORD: ${MODEL_DATABASE_PASSWORD:-}
      DB_SCHEMA: model_gateway
      SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN:?Run setup_env.py first}
      MODEL_MODE: ${MODEL_MODE:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-demo-model}
    volumes: [model-data:/app/data]
    mem_limit: 640m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8082/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
  automation-platform:
    build: ../../../automation-platform
    image: ai-sdlc/automation-platform:0.2.0
    restart: unless-stopped
    environment:
      <<: *java-env
      PORT: 8083
      DATABASE_URL: ${AUTOMATION_DATABASE_URL:-}
      DATABASE_USER: ${AUTOMATION_DATABASE_USER:-}
      DATABASE_PASSWORD: ${AUTOMATION_DATABASE_PASSWORD:-}
      SUPABASE_URL: ${AUTOMATION_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${AUTOMATION_SUPABASE_SERVICE_ROLE_KEY:-}
      ARTIFACT_MODE: ${ARTIFACT_MODE:-supabase}
      ARTIFACT_DIR: /app/data/artifacts
      DB_SCHEMA: automation_platform
      SERVICE_TOKEN: ${AUTOMATION_SERVICE_TOKEN:?Run setup_env.py first}
      STORAGE_BUCKET: automation-platform-artifacts
      MODEL_GATEWAY_URL: http://model-gateway:8082
      SANDBOX_GATEWAY_URL: http://sandbox-gateway:8081
      MODEL_SERVICE_TOKEN: ${MODEL_SERVICE_TOKEN}
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN}
      GIT_REPOSITORIES_JSON: ${GIT_REPOSITORIES_JSON:-}
    depends_on:
      sandbox-gateway: {condition: service_healthy}
      model-gateway: {condition: service_healthy}
    volumes: [automation-data:/app/data]
    mem_limit: 640m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8083/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
  ai-sdlc:
    build: ../..
    image: ai-sdlc/workbench:0.2.0
    restart: unless-stopped
    environment:
      PUBLIC_SUPABASE_URL: ${AI_SDLC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${AI_SDLC_SUPABASE_ANON_KEY:-}
      PUBLIC_WORKSPACE_TRANSPORT: ${AI_SDLC_WORKSPACE_TRANSPORT:-rpc}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8098}:8080"]
    depends_on:
      automation-platform: {condition: service_healthy}
      automation-console: {condition: service_started}
      model-console: {condition: service_started}
      sandbox-console: {condition: service_started}
    mem_limit: 128m
  automation-console:
    build: ../../../automation-platform/frontend
    image: ai-sdlc/automation-console:0.2.0
    restart: unless-stopped
    environment:
      PUBLIC_SUPABASE_URL: ${AI_SDLC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${AI_SDLC_SUPABASE_ANON_KEY:-}
    mem_limit: 48m
  model-console:
    build: ../../../model-gateway/frontend
    image: ai-sdlc/model-console:0.2.0
    restart: unless-stopped
    environment:
      PUBLIC_SUPABASE_URL: ${AI_SDLC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${AI_SDLC_SUPABASE_ANON_KEY:-}
    mem_limit: 48m
  sandbox-console:
    build: ../../../sandbox-gateway/frontend
    image: ai-sdlc/sandbox-console:0.2.0
    restart: unless-stopped
    environment:
      PUBLIC_SUPABASE_URL: ${AI_SDLC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${AI_SDLC_SUPABASE_ANON_KEY:-}
    mem_limit: 48m
  runner-image:
    build: ../../../automation-platform/runner
    image: ai-sdlc-runner:0.2.0
    profiles: [build]
    entrypoint: [node, -e, "process.exit(0)"]
volumes:
  sandbox-data:
  model-data:
  automation-data:
